[project]
name = "transport-steering"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = ["anndata>=0.10", "h5py", "numpy", "pandas", "pyarrow", "scipy", "scikit-learn", "torch>=2.2", "PyYAML"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
transport-study = "transport_study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transport_study"]

[tool.pytest.ini_options]
testpaths = ["tests"]
